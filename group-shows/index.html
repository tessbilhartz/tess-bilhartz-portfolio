<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Shows | Tess Bilhartz</title>
  <meta name="description" content="Selected group exhibitions with work by Tess Bilhartz, including NADA NY, Primary in Miami, and Halsey McKay Gallery in East Hampton.">
  <link rel="canonical" href="https://www.tessbilhartz.com/group-shows/">
  <meta property="og:title" content="Group Shows | Tess Bilhartz">
  <meta property="og:description" content="Selected group exhibitions with work by Tess Bilhartz.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.tessbilhartz.com/group-shows/">
  <meta property="og:image" content="https://www.tessbilhartz.com/images/GroupShows.01.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    /* ONE place to control sizes: width as a share of the page column */
    :root { --portrait-w: 68%; --landscape-w: 80%; --detail-w: 56%; }
    @media (max-width: 700px) {
      :root { --portrait-w: 100%; --landscape-w: 100%; --detail-w: 80%; }
    }

    /* Each figure is a centered box; the image fills it and the caption lines up with its left edge */
    main figure { width: var(--portrait-w); margin: 0 auto 40px; }
    main figure.is-landscape { width: var(--landscape-w); }
    /* Detail shots stay smaller than the full work they crop from */
    main figure.is-detail { width: var(--detail-w); }
    main figure img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: auto 4 / 5;      /* placeholder shape until the photo loads */
      object-fit: contain;
      background: #f3f3f3;
      cursor: zoom-in;
    }
    main figure.is-landscape img,
    main figure.is-detail img { aspect-ratio: auto 3 / 2; }

    /* Zoom viewer */
    .zl { position: fixed; inset: 0; z-index: 2000; display: flex; overflow: auto; background: rgba(255,255,255,.98); }
    .zl[hidden] { display: none; }
    .zl img { display: block; flex: none; margin: auto; width: auto; height: auto; max-width: calc(100vw - 48px); max-height: calc(100vh - 48px); cursor: zoom-in; }
    .zl.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
    .zl button { position: fixed; z-index: 2001; background: none; border: 0; padding: 8px 14px; font-size: 34px; line-height: 1; color: #000; cursor: pointer; }
    .zl-close { top: 8px; right: 12px; }
    .zl-prev, .zl-next { top: 50%; transform: translateY(-50%); }
    .zl-prev { left: 8px; }
    .zl-next { right: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="../">Tess Bilhartz</a>
    <nav class="site-nav">
      <a href="../exhibitions/">Exhibitions</a>
      <a href="../press/">Press</a>
      <a href="../cv/">About</a>
      <a href="../contact/">Contact</a>
    </nav>
  </header>

  <main>
    <figure class="is-landscape">
      <img src="../images/GroupShows.01.jpg" alt="Installation shot of Deanna Evans Projects' booth at NADA NY, 2026" fetchpriority="high">
      <figcaption>Installation shot of Deanna Evans Projects' booth at NADA NY, 2026, with work also by Ben Cowan and Danielle Mysliwiec</figcaption>
    </figure>

    <figure class="is-landscape">
      <img src="../images/GroupShows.02.jpg" alt="Verge, 2026, oil on canvas" loading="lazy" decoding="async">
      <figcaption><em>Verge</em>, 2026, oil on canvas, 18 x 28 in.</figcaption>
    </figure>

    <figure class="is-landscape">
      <img src="../images/GroupShows.03.jpg" alt="Transparent, 2026, oil on canvas" loading="lazy" decoding="async">
      <figcaption><em>Transparent</em>, 2026, oil on canvas, 18 x 28 in.</figcaption>
    </figure>

    <figure class="is-landscape">
      <img src="../images/GroupShows.04.jpg" alt="Installation shot from Spring at Primary, Miami FL, 2023" loading="lazy" decoding="async">
      <figcaption>Installation shot from <em>Spring</em> at Primary, Miami FL, 2023<br>All three works are colored pencil on paper, 16x12 inches.</figcaption>
    </figure>

    <figure>
      <img src="../images/GroupShows.05.jpg" alt="Twisted, 2023, colored pencil on paper" loading="lazy" decoding="async">
      <figcaption><em>Twisted</em>, 2023, colored pencil on paper, 16x12 in.</figcaption>
    </figure>

    <figure class="is-landscape">
      <img src="../images/GroupShows.06.jpg" alt="Oil painting from Off-Kilter, a dark forest scene" loading="lazy" decoding="async">
      <figcaption>Oil on canvas, 24 x 36 inches, from <em>Off-Kilter</em><br>Presented by Deanna Evans Projects at Halsey McKay Gallery, East Hampton, NY, 2025</figcaption>
    </figure>

    <figure class="is-detail">
      <img src="../images/GroupShows.07.jpg" alt="Detail" loading="lazy" decoding="async">
      <figcaption>Detail</figcaption>
    </figure>
  </main>

  <footer class="site-footer">© Copyright 2026 Tess Bilhartz. All rights reserved.</footer>

  <div class="zl" id="zl" hidden>
    <button class="zl-close" id="zl-close" aria-label="Close">&times;</button>
    <button class="zl-prev" id="zl-prev" aria-label="Previous image">&#8249;</button>
    <button class="zl-next" id="zl-next" aria-label="Next image">&#8250;</button>
    <img id="zl-img" alt="">
  </div>

  <script>
    (function () {
      var thumbs = document.querySelectorAll('main figure img');
      var box = document.getElementById('zl');
      var big = document.getElementById('zl-img');
      var n = thumbs.length, idx = 0;

      function load(k) {
        idx = (k + n) % n;
        big.src = thumbs[idx].src;
        big.alt = thumbs[idx].alt;
        box.classList.remove('zoomed');
        big.style.width = '';
        box.scrollTop = 0;
        box.scrollLeft = 0;
      }
      function open(k) { load(k); box.hidden = false; document.body.style.overflow = 'hidden'; }
      function close() { box.hidden = true; document.body.style.overflow = ''; }

      for (var j = 0; j < n; j++) {
        (function (k) { thumbs[k].addEventListener('click', function () { open(k); }); })(j);
      }

      big.addEventListener('click', function (e) {
        if (box.classList.contains('zoomed')) {
          box.classList.remove('zoomed');
          big.style.width = '';
          return;
        }
        var r = big.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        var w = box.clientWidth * 2;
        box.classList.add('zoomed');
        big.style.width = w + 'px';
        box.scrollLeft = fx * w - e.clientX;
        box.scrollTop = fy * big.offsetHeight - e.clientY;
      });

      box.addEventListener('click', function (e) {
        if (e.target === box && !box.classList.contains('zoomed')) close();
      });
      document.getElementById('zl-close').addEventListener('click', close);
      document.getElementById('zl-prev').addEventListener('click', function () { load(idx - 1); });
      document.getElementById('zl-next').addEventListener('click', function () { load(idx + 1); });
      document.addEventListener('keydown', function (e) {
        if (box.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowRight') load(idx + 1);
        if (e.key === 'ArrowLeft') load(idx - 1);
      });
    })();
  </script>
</body>
</html>
