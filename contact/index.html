  <style>
    /* Contact: text on the left, image on the right */
    .contact-wrap {
      display: grid;
      grid-template-columns: 46% 1fr;
      align-items: center;
    }
    .contact-text { padding-right: 24px; }
    .contact-text p { margin: 0 0 1.6em; font-size: 14px; line-height: 1.4; }
    .contact-text p:last-child { margin-bottom: 0; }
    .contact-text .intro { white-space: nowrap; }   /* keeps the first sentence on one line */
    .contact-text a { text-decoration: underline; text-underline-offset: 2px; }
    .contact-text a:hover { color: #777; }
    .contact-text a.plain { text-decoration: none; }
    .contact-wrap img { display: block; width: 100%; height: auto; }

    @media (max-width: 700px) {
      .contact-wrap { grid-template-columns: 1fr; row-gap: 32px; }
      .contact-text { padding-right: 0; }
      .contact-text .intro { white-space: normal; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="../">Tess Bilhartz</a>
    <nav class="site-nav">
      <a href="../exhibitions/">Exhibitions</a>
      <a href="../press/">Press</a>
      <a href="../cv/">About</a>
      <a href="../contact/" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <div class="contact-wrap">
      <div class="contact-text">
        <p class="intro">Please reach out for studio visits and other inquiries.</p>
        <p><a class="plain" href="mailto:tess.bilhartz@gmail.com">tess.bilhartz@gmail.com</a></p>
        <p>instagram - <a href="https://www.instagram.com/tess_bilhartz/" target="_blank" rel="noopener">@tess_bilhartz</a></p>
        <p>represented by <a href="https://www.deannaevansprojects.com" target="_blank" rel="noopener">Deanna Evans Projects</a></p>
        <p><a class="plain" href="mailto:info@deannaevansprojects.com">info@deannaevansprojects.com</a></p>
      </div>
      <img src="../images/Contact.01.jpg" alt="Mixed-media drawing of a figure in a yellow-green garment lying on a rippled beach" fetchpriority="high">
    </div>
  </main>

  <footer class="site-footer">© Copyright 2026 Tess Bilhartz. All rights reserved.</footer>
</body>
</html>
