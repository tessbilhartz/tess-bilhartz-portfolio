  <style>
    /* Two-column grid. Every thumbnail sits in the same-shaped tile, so rows line up cleanly. */
    :root {
      --tile: 1 / 1;          /* tile shape: try 4 / 5 (taller) or 4 / 3 (wider) */
      --fit: contain;         /* contain = whole artwork visible; cover = fills the tile, crops the edges */
      --tile-bg: #f3f3f3;     /* tile background; use #fff to blend with the page */
      --col-gap: 40px;
      --row-gap: 44px;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--col-gap);
      row-gap: var(--row-gap);
      align-items: start;
    }
    main .exhibit,
    main .exhibit.portrait { margin: 0; }
    main .exhibit a,
    main .exhibit.portrait a { display: block; width: 100%; }
    main .exhibit img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: var(--tile) !important;
      object-fit: var(--fit);
      background: var(--tile-bg);
    }
    main .exhibit .caption { display: block; margin-top: 8px; }

    @media (max-width: 560px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
